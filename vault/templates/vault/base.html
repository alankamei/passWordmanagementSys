{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VAULT{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vault/style.css' %}">
</head>
<body>
    <div class="container">
        <header>
            <h1>[ VAULT ]</h1>
            <nav>
                {% if user.is_authenticated %}
                    <span>USER: {{ user.username|upper }}</span>
                    <a href="/">VAULT</a>
                    <form method="post" action="{% url 'logout' %}" style="display:inline">
                        {% csrf_token %}
                        <button type="submit">LOG OUT</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">LOGIN</a>
                    <a href="/accounts/register/">REGISTER</a>
                {% endif %}
            </nav>
        </header>
        <hr>
        <main>
            {% block content %}{% endblock %}
        </main>
        <hr>
        <footer>
            <span class="help-text">VAULT // MONOCHROME PASSWORD MANAGER</span>
        </footer>
    </div>
</body>
</html>
